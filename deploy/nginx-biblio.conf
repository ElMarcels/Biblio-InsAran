# Proxy inverso para la Biblioteca Institut d'Aran.
#
#   sudo cp deploy/nginx-biblio.conf /etc/nginx/sites-available/biblio
#   sudo ln -s /etc/nginx/sites-available/biblio /etc/nginx/sites-enabled/biblio
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado TLS se obtiene, por ejemplo, con:
#   sudo certbot --nginx -d biblioteca.institutdaran.example

server {
    listen 80;
    listen [::]:80;
    server_name biblioteca.institutdaran.example;

    # Redirige todo el tráfico a HTTPS (la cookie de sesión lo requiere).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biblioteca.institutdaran.example;

    ssl_certificate     /etc/letsencrypt/live/biblioteca.institutdaran.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblioteca.institutdaran.example/privkey.pem;

    # Tamaño máximo de formulario (fichas de libro)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Los recursos estáticos de Next.js se pueden cachear con holgura.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
